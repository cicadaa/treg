<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- treg viral: the dark oil-painting plate behind every scene.
       Pastel oil painting (painting-pastel.png, downscaled: the 46 px blur hides all detail),
       graded almost to black: brightness 0.2 -> saturate 2.2 -> contrast 1.15 -> blur 46,
       on #050407, with an elliptical vignette. Same numbers as Plate in src/TregViral.tsx (drift 0.08). -->
  <defs>
    <filter id="grade" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.2"/>
        <feFuncG type="linear" slope="0.2"/>
        <feFuncB type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feColorMatrix type="saturate" values="2.2"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.15" intercept="-0.075"/>
        <feFuncG type="linear" slope="1.15" intercept="-0.075"/>
        <feFuncB type="linear" slope="1.15" intercept="-0.075"/>
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <radialGradient id="vignette" gradientUnits="userSpaceOnUse" cx="960" cy="540" r="1440"
      gradientTransform="translate(960 540) scale(1 0.525) translate(-960 -540)">
      <stop offset="0" stop-color="#030205" stop-opacity="0"/>
      <stop offset="1" stop-color="#030205" stop-opacity="0.72"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1920" height="1080"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1920" height="1080" fill="#050407"/>
    <image href="data:image/jpeg;base64," x="-396.8" y="-1013.6" width="2688" height="4032"
      preserveAspectRatio="none" filter="url(#grade)"/>
    <rect width="1920" height="1080" fill="url(#vignette)"/>
  </g>
</svg>
